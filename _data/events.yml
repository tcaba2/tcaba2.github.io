# Conferences, schools, talks and research visits, in any order.
# Each event is listed under "Upcoming" until its `end` date has passed, then
# under "Past". The split happens when GitHub Pages rebuilds the site (on every
# push), so an event moves to "Past" at the first push after it ends.
#
#   kind:  talk | poster | conference | school | workshop | panel | visit
#          (sets the colour; also the tag text unless `tag` is given)
#   tag:   optional tag text, e.g. "Poster, awarded"
#   start: first day, "YYYY-MM-DD" (quoted), used for sorting
#   end:   last day, "YYYY-MM-DD" (quoted)
#   dates: the date text shown on the page
#   title: event name
#   place: City, Country

