# Rebuilds the GitHub Pages site once a day so that calendar events move from
# "Upcoming" to "Past" even when nothing has been pushed.
name: Daily Pages rebuild

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
